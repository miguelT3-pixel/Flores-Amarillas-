<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Tulip Garden with Shooting Stars</title>
<style>
*,*::after,*::before{padding:0;margin:0;box-sizing:border-box}
:root{--dark-color:#000;--fl-speed:.8s;--speed-leaf:2s}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden}
body{display:flex;align-items:flex-end;justify-content:center;min-height:100vh;background-color:var(--dark-color);perspective:1000px}
.night{position:fixed;left:50%;top:0;transform:translateX(-50%);width:100%;height:100%;filter:blur(.1vmin);background-image:radial-gradient(ellipse at top,transparent 0%,var(--dark-color)),radial-gradient(ellipse at bottom,var(--dark-color),rgba(145,233,255,.2)),repeating-linear-gradient(220deg,#000 0px,#000 19px,transparent 19px,transparent 22px),repeating-linear-gradient(189deg,#000 0px,#000 19px,transparent 19px,transparent 22px),repeating-linear-gradient(148deg,#000 0px,#000 19px,transparent 19px,transparent 22px),linear-gradient(90deg,#002b55,#101820)}
.shooting-stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.shooting-star{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;box-shadow:0 0 6px 2px rgba(255,255,255,.8);opacity:0;animation:shootingStar 3s linear infinite}
.shooting-star::before{content:'';position:absolute;top:50%;right:0;transform:translateY(-50%);width:0;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);animation:shootingStarTail 3s linear infinite}
.shooting-star:nth-child(1){top:5%;left:-10%;animation-delay:0s;animation-duration:2.5s}
.shooting-star:nth-child(2){top:15%;left:-10%;animation-delay:2s;animation-duration:3s}
.shooting-star:nth-child(3){top:25%;left:-10%;animation-delay:4s;animation-duration:2.8s}
.shooting-star:nth-child(4){top:0%;left:-10%;animation-delay:6s;animation-duration:3.2s}
.shooting-star:nth-child(5){top:35%;left:-10%;animation-delay:8s;animation-duration:2.7s}
.shooting-star:nth-child(6){top:8%;left:-10%;animation-delay:10s;animation-duration:3.1s}
.shooting-star:nth-child(7){top:45%;left:-10%;animation-delay:12s;animation-duration:2.9s}
.shooting-star:nth-child(8){top:3%;left:-10%;animation-delay:14s;animation-duration:3.3s}
@keyframes shootingStar{0%{opacity:0;transform:translateX(0) translateY(0) rotate(45deg)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateX(120vw) translateY(50vh) rotate(10deg)}}
@keyframes shootingStarTail{0%{width:0}30%{width:100px}100%{width:0}}

.flowers{position:relative;transform:scale(.9);z-index:2}
.flower{position:absolute;bottom:10vmin;transform-origin:bottom center;z-index:50}
.flower--1{animation:moving-flower-1 4s linear infinite}
.flower--1 .flower__line{height:70vmin;animation-delay:.3s}
.flower--1 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 1.6s backwards}
.flower--1 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 1.4s backwards}
.flower--1 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 1.2s backwards}
.flower--1 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 1s backwards}
.flower--2{left:50%;transform:rotate(20deg);animation:moving-flower-2 4s linear infinite}
.flower--2 .flower__line{height:60vmin;animation-delay:.6s}
.flower--2 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 1.9s backwards}
.flower--2 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 1.7s backwards}
.flower--2 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 1.5s backwards}
.flower--2 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 1.3s backwards}
.flower--3{left:50%;transform:rotate(-15deg);animation:moving-flower-3 4s linear infinite}
.flower--3 .flower__line{animation-delay:.9s}
.flower--3 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 2.5s backwards}
.flower--3 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 2.3s backwards}
.flower--3 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 2.1s backwards}
.flower--3 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 1.9s backwards}
.flower--4{left:-25%;z-index:-6;transform:rotate(10deg);animation:moving-flower-4 3.5s linear infinite}
.flower--4 .flower__line{height:90vmin;animation-delay:1.2s}
.flower--4 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 2.8s backwards}
.flower--4 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 2.6s backwards}
.flower--4 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 2.4s backwards}
.flower--4 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 2.2s backwards}
.flower--5{left:75%;z-index:-7;transform:rotate(-25deg);animation:moving-flower-5 4.5s linear infinite}
.flower--5 .flower__line{height:85vmin;animation-delay:1.9s}
.flower--5 .flower__line__leaf--1{animation:blooming-leaf-right var(--fl-speed) 2.7s backwards}
.flower--5 .flower__line__leaf--2{animation:blooming-leaf-right var(--fl-speed) 2.5s backwards}
.flower--5 .flower__line__leaf--3{animation:blooming-leaf-left var(--fl-speed) 2.3s backwards}
.flower--5 .flower__line__leaf--4{animation:blooming-leaf-left var(--fl-speed) 2.1s backwards}

.flower__leafs{position:relative;animation:blooming-flower 2s backwards}
.flower__leafs--1{animation-delay:1.1s}.flower__leafs--2{animation-delay:1.4s}.flower__leafs--3{animation-delay:1.7s}.flower__leafs--4{animation-delay:2s}.flower__leafs--5{animation-delay:2s}
.flower__leafs::after{content:"";position:absolute;left:0;top:0;transform:translate(-50%,-100%);width:8vmin;height:8vmin;background:#6bbcff;filter:blur(10vmin)}

.flower__leaf{position:absolute;bottom:0;left:50%;width:11vmin;height:17vmin;border-radius:55% 55% 42% 42%;background:linear-gradient(to right,#082567,#1565c0 45%,#64b5f6);transform-origin:bottom center;opacity:.98;box-shadow:inset 0 0 1.5vmin rgba(255,255,255,.35),0 0 2vmin rgba(33,150,243,.35);z-index:2}
.flower__leaf:nth-child(1){transform:translate(-50%,0) rotate(-34deg)!important}
.flower__leaf:nth-child(2){transform:translate(-50%,0) rotate(-20deg)!important}
.flower__leaf:nth-child(3){transform:translate(-50%,0) rotate(-7deg)!important}
.flower__leaf:nth-child(4){transform:translate(-50%,0) rotate(7deg)!important}
.flower__leaf:nth-child(5){transform:translate(-50%,0) rotate(20deg)!important}
.flower__leaf:nth-child(6){transform:translate(-50%,0) rotate(34deg)!important}
.flower__leaf:nth-child(n+7){display:none}

.flower__white-circle{position:absolute;left:-4vmin;top:-4vmin;width:10vmin;height:10vmin;border-radius:50%;background:#0b2d5c;box-shadow:inset 0 0 2vmin rgba(0,0,0,.8),0 0 1vmin rgba(33,150,243,.6);z-index:1}
.flower__white-circle::after{content:"";position:absolute;left:46%;top:31%;transform:translate(-50%,-50%);width:80%;height:80%;z-index:3;border-radius:inherit;background:radial-gradient(circle at center,#164d86,#082567)}

.flower__line{height:55vmin;width:2vmin;background-image:linear-gradient(to left,rgba(0,0,0,.3),transparent,rgba(255,255,255,.2)),linear-gradient(to top,transparent 10%,#173f25,#28633a,#4f8f45);box-shadow:inset 0 0 2px rgba(0,0,0,.7);animation:grow-flower-tree 4s backwards}
.flower__line__leaf{--w:8vmin;--h:calc(var(--w) + 3vmin);position:absolute;top:20%;left:90%;width:var(--w);height:var(--h);border-top-right-radius:var(--h);border-bottom-left-radius:var(--h);background-image:linear-gradient(to top,rgba(45,80,22,.6),#28633a,#6b9e55);box-shadow:inset 0 0 1vmin rgba(0,0,0,.3)}
.flower__line__leaf--1{transform:rotate(70deg) rotateY(30deg)}
.flower__line__leaf--2{top:45%;transform:rotate(70deg) rotateY(30deg)}
.flower__line__leaf--3,.flower__line__leaf--4{border-top-right-radius:0;border-bottom-left-radius:0;border-top-left-radius:var(--h);border-bottom-right-radius:var(--h);left:-460%;top:12%;transform:rotate(-70deg) rotateY(30deg)}
.flower__line__leaf--4{top:40%}

.flower__light{position:absolute;bottom:0;width:.8vmin;height:.8vmin;background:#2d75b8;border-radius:50%;filter:blur(.1vmin);animation:sunflower-seeds 6s linear infinite backwards;box-shadow:0 0 1vmin rgba(33,150,243,.8)}
.flower__light:nth-child(odd){background:#64b5f6}
.flower__light--1{left:-2vmin;animation-delay:1s}.flower__light--2{left:3vmin;animation-delay:.5s}.flower__light--3{left:-6vmin;animation-delay:.3s}.flower__light--4{left:6vmin;animation-delay:.9s}.flower__light--5{left:-1vmin;animation-delay:1.5s}.flower__light--6{left:-4vmin;animation-delay:3s}.flower__light--7{left:3vmin;animation-delay:2s}.flower__light--8{left:-6vmin;animation-delay:3.5s}

.flower__grass{--c:#4a7c23;--line-w:2vmin;position:absolute;bottom:12vmin;left:-7vmin;display:flex;flex-direction:column;align-items:flex-end;z-index:20;transform-origin:bottom center;transform:rotate(-48deg) rotateY(40deg)}
.flower__grass--1{animation:moving-grass 2s linear infinite}
.flower__grass--2{left:2vmin;bottom:10vmin;transform:scale(.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);opacity:.8;z-index:0;animation:moving-grass--2 1.5s linear infinite}
.flower__grass--3{left:-25vmin;bottom:8vmin;transform:scale(.7) rotate(-30deg) rotateY(45deg);opacity:.9;z-index:15;animation:moving-grass--3 2.2s linear infinite}
.flower__grass--4{left:-35vmin;bottom:15vmin;transform:scale(.4) rotate(60deg) rotateX(15deg) rotateY(-180deg);opacity:.7;z-index:5;animation:moving-grass--4 1.8s linear infinite}
.flower__grass--5{left:-18vmin;bottom:6vmin;transform:scale(.6) rotate(-60deg) rotateY(60deg);opacity:.85;z-index:12;animation:moving-grass--5 2.5s linear infinite}
.flower__grass--6{left:25vmin;bottom:9vmin;transform:scale(.65) rotate(35deg) rotateY(-45deg);opacity:.9;z-index:15;animation:moving-grass--6 2.3s linear infinite}
.flower__grass--7{left:35vmin;bottom:14vmin;transform:scale(.45) rotate(-70deg) rotateX(20deg) rotateY(170deg);opacity:.75;z-index:8;animation:moving-grass--7 1.9s linear infinite}
.flower__grass--8{left:18vmin;bottom:5vmin;transform:scale(.55) rotate(50deg) rotateY(-70deg);opacity:.8;z-index:10;animation:moving-grass--8 2.1s linear infinite}
.flower__grass--9{left:-45vmin;bottom:20vmin;transform:scale(.3) rotate(20deg) rotateY(90deg);opacity:.6;z-index:2;animation:moving-grass--9 1.6s linear infinite}
.flower__grass--10{left:42vmin;bottom:18vmin;transform:scale(.35) rotate(-45deg) rotateY(-120deg);opacity:.65;z-index:3;animation:moving-grass--10 2s linear infinite}
.flower__grass--top{width:7vmin;height:10vmin;border-top-right-radius:100%;border-right:var(--line-w) solid var(--c);transform-origin:bottom center;transform:rotate(-2deg)}
.flower__grass--bottom{margin-top:-2px;width:var(--line-w);height:25vmin;background-image:linear-gradient(to top,transparent,var(--c))}
.flower__grass__leaf{--size:10vmin;position:absolute;width:calc(var(--size)*2.1);height:var(--size);border-top-left-radius:var(--size);border-top-right-radius:var(--size);background-image:linear-gradient(to top,transparent,transparent 30%,var(--c));z-index:100}
.flower__grass__leaf--1{top:-6%;left:30%;--size:6vmin;transform:rotate(-20deg);animation:growing-grass-ans--1 var(--speed-leaf) 2.6s backwards}
.flower__grass__leaf--2{top:-5%;left:-110%;--size:6vmin;transform:rotate(10deg);animation:growing-grass-ans--2 var(--speed-leaf) 2.4s linear backwards}
.flower__grass__leaf--3{top:5%;left:60%;--size:8vmin;transform:rotate(-18deg) rotateX(-20deg);animation:growing-grass-ans--3 var(--speed-leaf) 2.2s linear backwards}
.flower__grass__leaf--4{top:6%;left:-135%;--size:8vmin;transform:rotate(2deg);animation:growing-grass-ans--4 var(--speed-leaf) 2s linear backwards}
.flower__grass__leaf--5{top:20%;left:60%;--size:10vmin;transform:rotate(-24deg) rotateX(-20deg);animation:growing-grass-ans--5 var(--speed-leaf) 1.8s linear backwards}
.flower__grass__leaf--6{top:22%;left:-180%;--size:10vmin;transform:rotate(10deg);animation:growing-grass-ans--6 var(--speed-leaf) 1.6s linear backwards}
.flower__grass__leaf--7{top:39%;left:70%;--size:10vmin;transform:rotate(-10deg);animation:growing-grass-ans--7 var(--speed-leaf) 1.4s linear backwards}
.flower__grass__leaf--8{top:40%;left:-215%;--size:11vmin;transform:rotate(10deg);animation:growing-grass-ans--8 var(--speed-leaf) 1.2s linear backwards}
.flower__grass__overlay{position:absolute;top:-10%;right:0;width:100%;height:100%;background:rgba(0,0,0,.6);filter:blur(1.5vmin);z-index:100}
.grow-ans{animation:grow-ans 2s var(--d) backwards}.growing-grass{animation:growing-grass-ans 1s 2s backwards}.not-loaded *{animation-play-state:paused!important}

@keyframes grow-ans{0%{transform:scale(0);opacity:0}}
@keyframes growing-grass-ans{0%{transform:scale(0)}}
@keyframes growing-grass-ans--1{0%{transform-origin:bottom left;transform:rotate(-20deg) scale(0)}}
@keyframes growing-grass-ans--2{0%{transform-origin:bottom right;transform:rotate(10deg) scale(0)}}
@keyframes growing-grass-ans--3{0%{transform-origin:bottom left;transform:rotate(-18deg) rotateX(-20deg) scale(0)}}
@keyframes growing-grass-ans--4{0%{transform-origin:bottom right;transform:rotate(2deg) scale(0)}}
@keyframes growing-grass-ans--5{0%{transform-origin:bottom left;transform:rotate(-24deg) rotateX(-20deg) scale(0)}}
@keyframes growing-grass-ans--6{0%{transform-origin:bottom right;transform:rotate(10deg) scale(0)}}
@keyframes growing-grass-ans--7{0%{transform-origin:bottom left;transform:rotate(-10deg) scale(0)}}
@keyframes growing-grass-ans--8{0%{transform-origin:bottom right;transform:rotate(10deg) scale(0)}}
@keyframes sunflower-seeds{0%{opacity:0;transform:translateY(0) rotate(0)}20%{opacity:1;transform:translateY(-3vmin) translateX(-1vmin) rotate(45deg)}40%{opacity:1;transform:translateY(-8vmin) translateX(1vmin) rotate(90deg)}60%{transform:translateY(-12vmin) translateX(-1vmin) rotate(135deg)}80%{transform:translateY(-16vmin) translateX(2vmin) rotate(180deg);opacity:.5}100%{transform:translateY(-25vmin) rotate(225deg);opacity:0}}
@keyframes moving-flower-1{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}
@keyframes moving-flower-2{0%,100%{transform:rotate(18deg)}50%{transform:rotate(14deg)}}
@keyframes moving-flower-3{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(-20deg) rotateY(-10deg)}}
@keyframes moving-flower-4{0%,100%{transform:rotate(9deg)}50%{transform:rotate(12deg) rotateY(9deg)}}
@keyframes moving-flower-5{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(-11deg) rotateY(5deg)}}
@keyframes blooming-leaf-right{0%{transform-origin:left;transform:rotate(70deg) rotateY(30deg) scale(0)}}
@keyframes blooming-leaf-left{0%{transform-origin:right;transform:rotate(-70deg) rotateY(30deg) scale(0)}}
@keyframes grow-flower-tree{0%{height:0;border-radius:1vmin}}
@keyframes blooming-flower{0%{transform:scale(0)}}
@keyframes moving-grass{0%,100%{transform:rotate(-48deg) rotateY(40deg)}50%{transform:rotate(-50deg) rotateY(40deg)}}
@keyframes moving-grass--2{0%,100%{transform:scale(.5) rotate(75deg) rotateX(10deg) rotateY(-200deg)}50%{transform:scale(.5) rotate(79deg) rotateX(10deg) rotateY(-200deg)}}
@keyframes moving-grass--3{0%,100%{transform:scale(.7) rotate(-30deg) rotateY(45deg)}50%{transform:scale(.7) rotate(-33deg) rotateY(50deg)}}
@keyframes moving-grass--4{0%,100%{transform:scale(.4) rotate(60deg) rotateX(15deg) rotateY(-180deg)}50%{transform:scale(.4) rotate(63deg) rotateX(18deg) rotateY(-175deg)}}
@keyframes moving-grass--5{0%,100%{transform:scale(.6) rotate(-60deg) rotateY(60deg)}50%{transform:scale(.6) rotate(-57deg) rotateY(65deg)}}
@keyframes moving-grass--6{0%,100%{transform:scale(.65) rotate(35deg) rotateY(-45deg)}50%{transform:scale(.65) rotate(38deg) rotateY(-40deg)}}
@keyframes moving-grass--7{0%,100%{transform:scale(.45) rotate(-70deg) rotateX(20deg) rotateY(170deg)}50%{transform:scale(.45) rotate(-67deg) rotateX(23deg) rotateY(175deg)}}
@keyframes moving-grass--8{0%,100%{transform:scale(.55) rotate(50deg) rotateY(-70deg)}50%{transform:scale(.55) rotate(53deg) rotateY(-65deg)}}
@keyframes moving-grass--9{0%,100%{transform:scale(.3) rotate(20deg) rotateY(90deg)}50%{transform:scale(.3) rotate(23deg) rotateY(95deg)}}
@keyframes moving-grass--10{0%,100%{transform:scale(.35) rotate(-45deg) rotateY(-120deg)}50%{transform:scale(.35) rotate(-42deg) rotateY(-115deg)}}

.page-title{position:fixed;top:5vh;left:50%;transform:translateX(-50%);z-index:20;width:90%;text-align:center;color:#b3e5fc;font-family:Georgia,"Times New Roman",serif;font-size:clamp(25px,5vw,48px);font-weight:bold;text-shadow:0 0 8px rgba(33,150,243,.8),0 0 18px rgba(100,181,246,.5);animation:titleGlow 3s ease-in-out infinite;pointer-events:none}
@keyframes titleGlow{0%,100%{opacity:.85;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.03)}}

.particles{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:10}
.petal,.yellow-particle{position:absolute;top:-30px;pointer-events:none;opacity:0}
.petal{width:12px;height:20px;border-radius:70% 30% 70% 30%;background:linear-gradient(135deg,#b3e5fc,#2196f3,#0d47a1);box-shadow:0 0 7px rgba(33,150,243,.7),0 0 14px rgba(13,71,161,.4);animation:fallingPetal linear infinite}
@keyframes fallingPetal{0%{transform:translate3d(0,-40px,0) rotate(0);opacity:0}10%{opacity:.9}50%{transform:translate3d(40px,50vh,0) rotate(180deg)}90%{opacity:.9}100%{transform:translate3d(-40px,110vh,0) rotate(360deg);opacity:0}}
.yellow-particle{width:4px;height:4px;border-radius:50%;background:#64b5f6;box-shadow:0 0 5px #2196f3,0 0 10px rgba(33,150,243,.7);animation:fallingParticle linear infinite}
@keyframes fallingParticle{0%{transform:translate3d(0,-20px,0) scale(.5);opacity:0}15%{opacity:1}50%{transform:translate3d(-25px,50vh,0) scale(1)}85%{opacity:.8}100%{transform:translate3d(25px,110vh,0) scale(.3);opacity:0}}

.player{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:330px;max-width:calc(100vw - 30px);padding:13px 16px;display:flex;align-items:center;gap:13px;background:rgba(5,15,30,.82);border:1px solid rgba(33,150,243,.5);border-radius:18px;box-shadow:0 0 15px rgba(33,150,243,.2),inset 0 0 15px rgba(33,150,243,.05);backdrop-filter:blur(8px);z-index:1000}
.play{flex-shrink:0;width:45px;height:45px;border:none;border-radius:50%;background:linear-gradient(145deg,#42a5f5,#1565c0);color:#fff;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 0 10px rgba(33,150,243,.5);transition:transform .2s ease}
.play:hover{transform:scale(1.08)}.play:active{transform:scale(.95)}
.player-info{flex:1;min-width:0}
.song{color:#d9f1ff;font-family:Georgia,"Times New Roman",serif;font-size:15px;font-weight:bold;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-wrap{width:100%;height:5px;background:rgba(255,255,255,.18);border-radius:10px;overflow:hidden;cursor:pointer}
.progress{width:0%;height:100%;background:linear-gradient(90deg,#1565c0,#2196f3,#90caf9);border-radius:inherit}
.times{display:flex;justify-content:space-between;margin-top:4px;color:rgba(210,240,255,.75);font-family:Arial,sans-serif;font-size:10px}
@media(max-width:500px){.page-title{top:4vh;font-size:27px}.player{top:14vh;width:310px;max-width:calc(100vw - 30px);padding:10px 12px}.play{width:42px;height:42px}.song{font-size:13px}}
</style>
</head>

<script>
window.addEventListener("load",function(){
setTimeout(()=>document.body.classList.remove("not-loaded"),1000);

function createShootingStar(){
const star=document.createElement("div");star.className="shooting-star";star.dataset.dynamic="true";
star.style.top=Math.random()*60+"%";star.style.animationDelay="0s";star.style.animationDuration=(Math.random()*1.5+2)+"s";
document.querySelector(".shooting-stars").appendChild(star);setTimeout(()=>star.remove(),4000)
}
setInterval(()=>{if(Math.random()>.3)createShootingStar()},Math.random()*5000+3000);

const particleContainer=document.getElementById("particles");
function createPetal(){
const petal=document.createElement("div");petal.className="petal";petal.style.left=Math.random()*100+"%";petal.style.animationDuration=(Math.random()*5+6)+"s";petal.style.animationDelay=Math.random()*2+"s";
const size=Math.random()*.7+.7;petal.style.transform="scale("+size+")";particleContainer.appendChild(petal);setTimeout(()=>petal.remove(),12000)
}
function createYellowParticle(){
const particle=document.createElement("div");particle.className="yellow-particle";particle.style.left=Math.random()*100+"%";particle.style.animationDuration=(Math.random()*4+5)+"s";particle.style.animationDelay=Math.random()*2+"s";
const size=Math.random()*1.2+.5;particle.style.transform="scale("+size+")";particleContainer.appendChild(particle);setTimeout(()=>particle.remove(),11000)
}
setInterval(createPetal,650);setInterval(createYellowParticle,180);
for(let i=0;i<12;i++)createPetal();for(let i=0;i<30;i++)createYellowParticle();

const musica=document.getElementById("musica"),boton=document.getElementById("playBtn"),barra=document.getElementById("progress"),progressWrap=document.getElementById("progressWrap"),tiempoActual=document.getElementById("elapsed"),tiempoTotal=document.getElementById("total");
function tiempo(segundos){if(!isFinite(segundos)||segundos<=0)return"0:00";const minutos=Math.floor(segundos/60);let segundos2=Math.floor(segundos%60);if(segundos2<10)segundos2="0"+segundos2;return minutos+":"+segundos2}
function actualizarDuracion(){if(Number.isFinite(musica.duration)&&musica.duration>0)tiempoTotal.textContent=tiempo(musica.duration)}
musica.addEventListener("loadedmetadata",actualizarDuracion);musica.addEventListener("durationchange",actualizarDuracion);musica.addEventListener("loadeddata",actualizarDuracion);musica.addEventListener("canplay",actualizarDuracion);
musica.addEventListener("error",()=>console.log("ERROR AL CARGAR EL AUDIO:",musica.error));musica.load();actualizarDuracion();
musica.addEventListener("timeupdate",()=>{if(musica.duration>0){barra.style.width=(musica.currentTime/musica.duration)*100+"%";tiempoActual.textContent=tiempo(musica.currentTime)}});
function reproducir(){musica.play().then(()=>boton.textContent="Ⅱ").catch(error=>console.log("El navegador bloqueó el audio:",error))}
function pausar(){musica.pause();boton.textContent="▶"}
boton.addEventListener("click",event=>{event.stopPropagation();musica.paused?reproducir():pausar()});
progressWrap.addEventListener("click",event=>{if(!musica.duration)return;const rect=progressWrap.getBoundingClientRect();musica.currentTime=((event.clientX-rect.left)/rect.width)*musica.duration});
reproducir();
document.addEventListener("click",function iniciarAudio(){if(musica.paused)reproducir();document.removeEventListener("click",iniciarAudio)});

document.addEventListener("visibilitychange",()=>{
if(document.visibilityState==="visible"){
document.body.classList.add("not-loaded");
void document.body.offsetWidth;
document.querySelectorAll(".flower,.flower__line,.flower__line__leaf,.flower__grass,.flower__grass__leaf,.growing-grass,.grow-ans").forEach(el=>{
el.style.animation="none";void el.offsetWidth;el.style.animation="";
});
document.querySelectorAll(".shooting-star[data-dynamic='true']").forEach(star=>star.remove());
document.querySelectorAll(".shooting-star:not([data-dynamic])").forEach(star=>{star.style.animation="none";void star.offsetWidth;star.style.animation=""});
document.querySelectorAll(".petal,.yellow-particle").forEach(el=>el.remove());
for(let i=0;i<8;i++)createPetal();for(let i=0;i<20;i++)createYellowParticle();
musica.pause();musica.currentTime=0;boton.textContent="▶";barra.style.width="0%";tiempoActual.textContent="0:00";
setTimeout(()=>document.body.classList.remove("not-loaded"),150);
}
});
});
</script>
